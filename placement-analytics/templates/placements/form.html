{% extends "base.html" %}
{% block title %}Placement record{% endblock %}
{% block content %}
<h1 class="page">Placement record</h1>
<p class="lead-sm">Selected records need a company and package; shortlisted records need a company.</p>
<form method="post" class="panel" novalidate><div class="row g-3">
  <div class="col-md-6"><label class="form-label" for="student_id">Student *</label>
    <select class="form-select" id="student_id" name="student_id" required><option value="">Choose a student</option>
    {% for st in students %}<option value="{{ st.id }}" {{ 'selected' if (p.student_id|string) == (st.id|string) or request.args.student_id == st.id|string }}>{{ st.roll_no }} - {{ st.name }}</option>{% endfor %}</select></div>
  <div class="col-md-3"><label class="form-label" for="status">Status *</label>
    <select class="form-select" id="status" name="status">{% for s in statuses %}<option value="{{ s }}" {{ 'selected' if p.status == s }}>{{ s|capitalize }}</option>{% endfor %}</select></div>
  <div class="col-md-3"><label class="form-label" for="recruitment_year">Recruitment year *</label>
    <input type="number" class="form-control" id="recruitment_year" name="recruitment_year" value="{{ p.recruitment_year or year_now }}"></div>
  <div class="col-md-4"><label class="form-label" for="company">Company</label><input class="form-control" id="company" name="company" value="{{ p.company or '' }}"></div>
  <div class="col-md-4"><label class="form-label" for="job_role">Job role</label><input class="form-control" id="job_role" name="job_role" value="{{ p.job_role or '' }}"></div>
  <div class="col-md-4"><label class="form-label" for="package_lpa">Package (LPA)</label><input type="number" step="0.01" min="0" class="form-control" id="package_lpa" name="package_lpa" value="{{ p.package_lpa if p.package_lpa is not none else '' }}"></div>
</div>
<div class="mt-4 d-flex gap-2"><button class="btn btn-primary">Save record</button><a class="btn btn-outline-secondary" href="{{ url_for('placements.list_placements') }}">Cancel</a></div></form>
{% endblock %}
